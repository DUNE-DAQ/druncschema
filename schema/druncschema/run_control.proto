

syntax = "proto3";

package dunedaq.druncschema.run_control;

import "druncschema/common.proto";
import "druncschema/description.proto";
import "druncschema/request_response.proto";

service RunControl{
    rpc send_log  (SendLogRequest) returns (SendLogResponse) {}
    rpc describe  (Request) returns (Description) {}
}