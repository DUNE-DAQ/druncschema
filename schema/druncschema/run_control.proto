

syntax = "proto3";

package dunedaq.druncschema.run_control;

import "druncschema/common.proto";
import "druncschema/description.proto";
import "druncschema/request_response.proto";
import "druncschema/token.proto";
import "druncschema/process_manager.proto";

service RunControl{
    rpc send_log  (SendLogRequest) returns (SendLogResponse) {}
    rpc describe  (Request) returns (Description) {}


    rpc set_session_config (SessionConfiguration) returns (Response) {}
    rpc print_session_config (Request) returns (SessionConfiguration) {}
    rpc valid (Request) returns (Response) {}
    rpc connect_to_pm (ConnectToPMRequest) returns (Response) {}
    rpc ps        (dunedaq.druncschema.process_manager.ProcessQuery) returns (dunedaq.druncschema.process_manager.ProcessInstanceList) {}
}

message ConnectToPMRequest {
    dunedaq.druncschema.Token token = 1;
    string address = 2;
}


message SessionConfiguration {
    Token token = 1;
    string configuration_file = 3;
    string configuration_id = 4;
    string session_name = 5;   
    bool valid = 6;
}