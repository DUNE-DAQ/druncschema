syntax = "proto3";

package dunedaq.opmon.drunc;

message RunInfo {

  string run_type = 1;
  double trigger_rate = 2;
  int64  run_number = 3;
  bool disable_data_storage = 4;
}

message Status { // Contains dynamic system descriptors
  string state = 2;
  string sub_state = 3;
  bool   in_error = 4;
  bool   included = 5;
}

message Command_time { 
  float cmd_start_time = 1;
  float cmd_end_time = 2;
  float cmd_exe_time = 3;
}
